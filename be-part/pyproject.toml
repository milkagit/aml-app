[project]
name = "be-part"
version = "0.1.0"
description = "AML transaction monitoring backend: data ingestion, detection rules and API"
readme = "README.md"
authors = [
    { name = "mikki" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "polars>=2.1.0",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
be-part = "be_part:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
